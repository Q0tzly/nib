name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask build-plugins
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path plugins/Cargo.toml
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path plugins/Cargo.toml --workspace --target wasm32-wasip2 --locked -- -D warnings
      # Plugins' own unit tests, such as fuzzy matching, run natively.
      - run: cargo test --manifest-path plugins/Cargo.toml --workspace --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask build-plugins
      - run: cargo test --workspace --locked
