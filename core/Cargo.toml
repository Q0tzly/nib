[package]
name = "nib-core"
description = "Core of the nib editor: buffers, selections, rendering, and the plugin host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Line endings are normalized to LF on load, so only LF counts as a line break.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex-cursor = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
wasmtime = "48"
wasmtime-wasi = "48"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
