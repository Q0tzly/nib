# Plugins build only for wasm32-wasip2, so they live in their own workspace.
# Build them with `cargo xtask build-plugins` from the repository root.
[workspace]
resolver = "3"
members = ["helix", "indent", "lsp", "picker", "test/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nib-plugin = { path = "../sdk/rust" }
