# Data only: a grammar and its queries, no plugin code.
name = "markdown"
version = "0.1.0"
api = "0.1"

[[languages]]
name = "markdown"
file-types = ["md", "markdown"]
grammar = "tree-sitter-markdown.wasm"

[languages.queries]
highlights = "queries/highlights.scm"
textobjects = "queries/textobjects.scm"

# Fetched and checked by `cargo xtask build-plugins`; not in the repository.
[[fetch]]
file = "tree-sitter-markdown.wasm"
url = "https://github.com/tree-sitter-grammars/tree-sitter-markdown/releases/download/v0.5.3/tree-sitter-markdown.wasm"
sha256 = "dd9fc12ac2804d7c7da787e4774125b32e4fb3c244e5e7031a77cb7dd8036020"
