[package]
name = "nib-tui"
description = "Terminal frontend of the nib editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nib"
path = "src/main.rs"

[dependencies]
# The OS clipboard, which nib-core leaves to the frontend.
arboard = "3"
# Plugin archives (.nib.tar.gz) for `nib plugin pack` and `add`.
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
crossterm = "0.29"
nib-core = { path = "../core" }
